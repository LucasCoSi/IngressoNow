<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Configurações - IngressoNow</title>
 <style>
 :root{
 --bg:#F8FAFC;--surface:#FFFFFF;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
 --navy:#1E3A8A;--navy-dark:#0F172A;--nav-active:#1E293B;--cyan:#0284C7;--cyan-soft:#E0F2FE;
 --mist:#BAE6FD;--font-ui:"Segoe UI",Aptos,system-ui,sans-serif;--font-mono:"SFMono-Regular",Consolas,monospace
 }
 *{box-sizing:border-box} html{background:var(--bg)} body{margin:0;color:var(--ink);font:400 15px/1.55 var(--font-ui);background:var(--bg)}
 button,input,select,textarea{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--mist);outline-offset:2px}.icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
 .app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}
 .sidebar{background:var(--navy-dark);color:#fff;padding:26px 14px;display:flex;flex-direction:column;position:sticky;inset:0 auto 0 0;height:100vh}
 .brand{display:flex;align-items:center;gap:10px;margin:0 10px 40px;font-size:20px;font-weight:650;letter-spacing:-.03em}.mark{width:30px;height:30px;border-radius:6px;background:var(--navy);border:1px solid #2749A1;display:grid;place-items:center;color:#fff;font:700 10px var(--font-mono);letter-spacing:.08em}.brand-now{color:#38BDF8}
 .nav{display:grid;gap:2px}.nav-group{margin:19px 10px 7px;color:#93A7C6;font:600 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase}.nav-btn{border:0;border-radius:6px;background:transparent;color:#D9E4F4;padding:10px 11px;display:flex;align-items:center;gap:10px;text-align:left;font-size:13px;font-weight:550;transition:background .15s ease,color .15s ease}.nav-btn:hover{background:#16223A;color:#fff}.nav-btn.active{background:var(--nav-active);color:var(--mist);box-shadow:inset 2px 0 0 var(--cyan)}.org{margin-top:auto;border-top:1px solid #283854;padding:16px 10px 0;color:#B7C8E0;font-size:12px}.org strong{display:block;color:#fff;font-weight:600;margin-top:2px}
 .workspace{min-width:0}.topbar{height:68px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 34px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:2}.search-box{position:relative}.search-box .icon{position:absolute;left:11px;top:10px;color:var(--muted);pointer-events:none;width:16px;height:16px}.search{width:min(392px,45vw);height:38px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 12px 0 34px;color:var(--ink)}.search::placeholder{color:#64748B}.profile{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600}.avatar{width:31px;height:31px;border-radius:50%;background:var(--cyan-soft);color:var(--navy);display:grid;place-items:center;font-size:11px;font-weight:750}
 .main{max-width:1440px;padding:35px 42px 64px}.context{display:flex;align-items:end;justify-content:space-between;gap:24px;padding-bottom:25px;border-bottom:1px solid var(--line)}.context-label{margin:0 0 7px;color:var(--muted);font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}.context h1{margin:0;color:var(--navy);font-size:32px;line-height:1.12;letter-spacing:-.025em;font-weight:650}.context p{margin:8px 0 0;color:var(--muted);max-width:61ch}.context-actions{display:flex;gap:10px;flex-wrap:wrap}
 .primary{border:0;border-radius:6px;background:#2563EB;color:#fff;padding:11px 15px;font-size:13px;font-weight:700;letter-spacing:.02em;white-space:nowrap;transition:background .15s ease,box-shadow .15s ease;box-shadow:0 6px 16px rgba(2, 132, 199, 0.35)}.primary:active{transform:translateY(1px)}
 .secondary{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--navy);padding:9px 12px;font-size:12px;font-weight:700;transition:all .15s ease}.secondary:hover{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-soft)}.secondary:active{transform:translateY(1px)}

 .settings-tabs{display:flex;gap:0;margin:24px 0 32px;border-bottom:2px solid var(--line);overflow-x:auto}.settings-tab{border:0;background:transparent;color:var(--muted);padding:12px 18px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s ease;white-space:nowrap}.settings-tab:hover{color:var(--navy)}.settings-tab.active{color:var(--navy);background:none;border-bottom-color:var(--navy)}

 .settings-section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px;margin-bottom:24px}
 .settings-section h2{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--navy);letter-spacing:-.015em}
 .settings-section > p{margin:0 0 18px;font-size:12px;color:var(--muted)}
 .form-group{margin-bottom:18px}.form-group:last-child{margin-bottom:0}
 .form-label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
 .form-hint{font-size:11px;color:var(--muted);margin-top:4px}
 .form-input,.form-select,.form-textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--ink);font-size:13px;transition:all .15s ease;background:#fff}.form-input:hover,.form-select:hover,.form-textarea:hover{border-color:var(--cyan)}.form-input:focus-visible,.form-select:focus-visible,.form-textarea:focus-visible{border-color:var(--cyan);outline:0}
 .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-row.full{grid-template-columns:1fr}
 .form-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}

 .event-bar{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:22px}
 .event-bar .form-group{margin:0;min-width:280px;flex:1}

 .notice{border:1px solid #BAE6FD;background:#F0F9FF;color:#075985;border-radius:6px;padding:12px 14px;font-size:12px;margin-bottom:18px;line-height:1.5}
 .notice strong{color:#0C4A6E}
 .empty{border:1px dashed var(--line);border-radius:8px;padding:30px;text-align:center;color:var(--muted);font-size:13px;background:#fff}
 .badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700;background:var(--cyan-soft);color:#075985;white-space:nowrap}
 .table{width:100%;border-collapse:collapse;font-size:12px}
 .table th{text-align:left;color:var(--muted);font:600 10px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px}
 .table td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}
 .table select{min-width:190px}
 .check-list{display:grid;gap:8px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff}
 .check-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
 .check-item input{width:15px;height:15px}
 .check-item small{color:var(--muted)}
 .kv{display:grid;grid-template-columns:190px 1fr;gap:10px 16px;font-size:13px;margin:0}
 .kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}

 .mobile-nav{display:none}
 @media(max-width:1200px){.form-row{grid-template-columns:1fr}}
 @media(max-width:980px){.app{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding:22px 9px}.brand{margin:0 auto 30px}.brand span:not(.mark),.nav-group,.nav-btn{font-size:0}.nav-btn{height:42px;text-align:center}.org{display:none}.main{padding:30px}.context{display:block}.context h1{font-size:28px}.context p{font-size:13px}.context-actions{width:100%;margin-top:18px}.settings-tabs{margin:18px 0}.settings-section{padding:18px}.form-row{gap:12px}.kv{grid-template-columns:1fr;gap:4px}}
 @media(max-width:700px){.app{display:block}.sidebar{display:none}.topbar{height:61px;padding:0 16px}.search{width:54vw}.profile span:last-child{display:none}.main{padding:25px 16px 86px}.context{display:block}.context h1{font-size:28px}.context p{font-size:13px}.context-actions{width:100%;margin-top:18px;flex-direction:column}.primary,.secondary{width:100%;min-height:44px;margin-bottom:10px}.settings-tabs{margin:16px -16px 0;padding:0 16px}.settings-section{border-radius:4px;margin-bottom:16px;padding:16px}.form-label{font-size:11px}.form-input,.form-select,.form-textarea{font-size:12px;padding:8px 10px}.table{font-size:11px}.table select{min-width:140px}.mobile-nav{position:fixed;display:flex;z-index:4;bottom:0;left:0;right:0;height:66px;background:var(--navy-dark);justify-content:space-around;padding:7px 8px}.mobile-nav button{border:0;background:transparent;color:#BAE6FD;font-size:11px;font-weight:650}.mobile-nav button.active{color:#fff;border-top:2px solid var(--cyan)}}
 </style>
</head>
<body>
 <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
 <defs>
 <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-7h6v7"/></symbol>
 <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
 <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
 <symbol id="i-schedule" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></symbol>
 <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 0 0 4v2a2 2 0 0 0 0 4v1h16v-1a2 2 0 0 0 0-4v-2a2 2 0 0 0 0-4V6H4Z"/><path d="M13 7v10"/></symbol>
 <symbol id="i-scan" viewBox="0 0 24 24"><path d="M5 9V5h4M15 5h4v4M19 15v4h-4M9 19H5v-4"/><path d="M8 11h3v3H8zM14 10h2v2h-2zM14 14h2v2h-2z"/></symbol>
 <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.8-5.4 2.8 1-6.1-4.4-4.3 6.1-.9Z"/></symbol>
 <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 16v-4M12 16V8M16 16v-7"/></symbol>
 <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.3a3 3 0 0 1 0 5.4M18 14c1.8.8 3 2.6 3 4.7"/></symbol>
 <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.1 2.1-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-3v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-2.1-2.1.1-.1A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.5-1H5.3v-3h.2A1.7 1.7 0 0 0 7 10a1.7 1.7 0 0 0-.3-1.9l-.1-.1 2.1-2.1.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h3v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 2.1 2.1-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v3h-.2a1.7 1.7 0 0 0-1.4 1Z"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></symbol>
 </defs>
 </svg>
 <main class="app" data-od-id="settings-management">
 <aside class="sidebar" data-od-id="admin-sidebar">
 <div class="brand" data-od-id="brand-logo"><span class="mark">IN</span><span>Ingresso<span class="brand-now">Now</span></span></div>
 <nav class="nav" aria-label="Navegação administrativa">
 <button class="nav-btn" data-od-id="nav-dashboard"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Dashboard</button>
 <button class="nav-btn" data-od-id="nav-events"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg>Eventos</button>
 <button class="nav-btn" data-od-id="nav-activities"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>Atividades</button>
 <button class="nav-btn" data-od-id="nav-schedule"><svg class="icon" aria-hidden="true"><use href="#i-schedule"/></svg>Programação</button>
 <button class="nav-btn" data-od-id="nav-enrollments"><svg class="icon" aria-hidden="true"><use href="#i-ticket"/></svg>Inscrições</button>
 <button class="nav-btn" data-od-id="nav-attendance"><svg class="icon" aria-hidden="true"><use href="#i-scan"/></svg>Frequência</button>
 <button class="nav-btn" data-od-id="nav-evaluations"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg>Avaliações</button>
 <button class="nav-btn" data-od-id="nav-reports"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg>Relatórios</button>
 <p class="nav-group">Administração</p>
 <button class="nav-btn" data-od-id="nav-users"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>Usuários</button>
 <button class="nav-btn active" data-od-id="nav-settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>Configurações</button>
 </nav>
 <div class="org">Organização acadêmica<strong data-od-id="sidebar-org">Centro de Eventos Sul</strong></div>
 </aside>
 <section class="workspace">
 <header class="topbar" data-od-id="admin-header">
 <div class="search-box"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input class="search" data-od-id="global-search" aria-label="Buscar" placeholder="Buscar configurações..."></div>
 <div class="profile"><span class="avatar">--</span><span>Carregando...</span></div>
 </header>
 <section class="main" data-od-id="settings-content">
 <header class="context" data-od-id="settings-heading">
 <div>
 <p class="context-label" id="cfg-context-label">Gestão</p>
 <h1 id="cfg-title">Configurações</h1>
 <p id="cfg-subtitle">Carregando...</p>
 </div>
 <div class="context-actions">
 <button class="secondary" id="cfg-recarregar" type="button">Recarregar</button>
 </div>
 </header>

 <div class="settings-tabs" id="cfg-tabs" data-od-id="settings-tab-bar" role="tablist"></div>
 <div id="cfg-panels">
 <div class="empty">Carregando configurações...</div>
 </div>
 </section>
 </section>
 </main>
 <nav class="mobile-nav" aria-label="Navegação móvel"><button class="active">Início</button><button>Eventos</button><button>Agenda</button><button>Mais</button></nav>

 <div id="error-container"></div>

 <link rel="stylesheet" href="/css/alerts.css">
 <script src="/js/api-client.js"></script>
 <script src="/js/nav.js"></script>
 <script src="/js/configuracoes.js"></script>
</body>
</html>
