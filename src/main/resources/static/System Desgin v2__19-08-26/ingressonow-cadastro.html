<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8">
 <link rel="icon" type="image/svg+xml" href="/favicon.svg">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Cadastro - IngressoNow</title>
 <style>
 :root{
 --bg:#F8FAFC;--surface:#FFFFFF;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
 --navy:#1E3A8A;--navy-dark:#0F172A;--cyan:#0284C7;--cyan-soft:#E0F2FE;
 --font-ui:"Segoe UI",Aptos,system-ui,sans-serif
 }
 *{box-sizing:border-box}
 html,body{height:100%;margin:0}
 body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font-ui);display:flex;align-items:center;justify-content:center;padding:20px}
 button,input{font:inherit}
 button{cursor:pointer}
 button:focus-visible,input:focus-visible{outline:3px solid var(--cyan-soft);outline-offset:2px}

 .auth-container{width:100%;max-width:420px}
 .auth-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:40px;box-shadow:0 2px 8px rgba(0,0,0,.06)}

 .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px}
 .logo-mark{width:40px;height:40px;border-radius:6px;background:var(--navy);border:1px solid #2749A1;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;letter-spacing:.05em}
 .logo-text{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--navy-dark)}
 .logo-text-now{color:#38BDF8}

 .auth-title{font-size:22px;font-weight:700;color:var(--navy);margin:0 0 8px;text-align:center;letter-spacing:-.02em}
 .auth-subtitle{font-size:14px;color:var(--muted);margin:0 0 32px;text-align:center;line-height:1.5}

 .form-group{margin-bottom:20px}
 .form-label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px}
 .form-input{width:100%;height:44px;border:1px solid var(--line);border-radius:6px;padding:0 12px;font-size:14px;color:var(--ink);background:#fff;transition:all .15s ease}
 .form-input::placeholder{color:var(--muted)}
 .form-input:hover{border-color:var(--cyan)}
 .form-input:focus{outline:0;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(2, 132, 199, 0.1)}

 .form-checkbox-wrapper{display:flex;align-items:flex-start;gap:10px;margin-bottom:24px}
 .form-checkbox{width:16px;height:16px;margin-top:2px;cursor:pointer;accent-color:var(--cyan);flex-shrink:0}
 .form-checkbox-label{font-size:13px;color:var(--ink);cursor:pointer;user-select:none;line-height:1.4}
 .form-checkbox-label a{color:var(--cyan);text-decoration:none;font-weight:600}
 .form-checkbox-label a:hover{text-decoration:underline}

 .btn-primary{width:100%;height:48px;border:0;border-radius:6px;background:#2563EB;color:#fff;font-size:14px;font-weight:700;letter-spacing:.02em;transition:all .15s ease}
 .btn-primary:hover{background:#1D4ED8;transform:translateY(-1px)}
 .btn-primary:active{transform:translateY(0)}
 .btn-primary:disabled{background:var(--muted);cursor:not-allowed;transform:none;opacity:0.6}

 .auth-footer{margin-top:28px;text-align:center;padding-top:24px;border-top:1px solid var(--line)}
 .auth-footer-text{font-size:14px;color:var(--muted);margin:0}
 .auth-footer-link{color:var(--cyan);text-decoration:none;font-weight:600;transition:color .15s ease}
 .auth-footer-link:hover{color:var(--navy);text-decoration:underline}

 .password-hint{font-size:12px;color:var(--muted);margin-top:4px}
 .password-hint b{font-variant-numeric:tabular-nums}
 .password-hint.ok{color:#059669}
 .password-hint.bad{color:#DC2626}

 .auth-feedback .alert{margin-bottom:16px}

 @media(max-width:480px){
  body{padding:16px}
  .auth-card{padding:28px 24px}
  .logo{margin-bottom:24px}
  .logo-mark{width:36px;height:36px;font-size:11px}
  .logo-text{font-size:22px}
  .auth-title{font-size:19px}
  .auth-subtitle{font-size:13px;margin-bottom:24px}
  .form-group{margin-bottom:16px}
 }
 </style>
</head>
<body>
 <div class="auth-container" data-od-id="signup-container">
 <div class="auth-card" data-od-id="signup-card">
 <div class="logo" data-od-id="brand-logo">
 <div class="logo-mark">IN</div>
 <div class="logo-text">Ingresso<span class="logo-text-now">Now</span></div>
 </div>

 <h1 class="auth-title">Criar nova conta</h1>
 <p class="auth-subtitle">Preencha os dados abaixo para começar</p>

 <div id="form-feedback" class="auth-feedback" aria-live="polite"></div>

 <form data-od-id="signup-form">
 <div class="form-group">
 <label class="form-label" for="fullname">Nome Completo</label>
 <input
 type="text"
 id="fullname"
 class="form-input"
 placeholder="Digite seu nome completo"
 required
 data-od-id="fullname-input">
 </div>

 <div class="form-group">
 <label class="form-label" for="email">E-mail</label>
 <input
 type="email"
 id="email"
 class="form-input"
 placeholder="seuemail@instituicao.edu.br"
 required
 data-od-id="email-input">
 </div>

 <div class="form-group">
 <label class="form-label" for="password">Senha</label>
 <input
 type="password"
 id="password"
 class="form-input"
 placeholder="Crie uma senha segura"
 required
 minlength="8"
 maxlength="72"
 data-od-id="password-input">
 <div class="password-hint" id="password-hint">Mínimo de 8 caracteres — <b id="password-counter">0/8</b></div>
 </div>

 <div class="form-group">
 <label class="form-label" for="confirm-password">Confirmar Senha</label>
 <input
 type="password"
 id="confirm-password"
 class="form-input"
 placeholder="Digite a senha novamente"
 required
 maxlength="72"
 data-od-id="confirm-password-input">
 <div class="password-hint" id="confirm-hint">Repita a senha para confirmar.</div>
 </div>

 <div class="form-group">
 <label class="form-label">Tipo de conta</label>
 <div class="password-hint" style="margin-top:0">
 Conta de <b>participante</b>. Contas de organizador são criadas por um
 administrador na área de gestão.
 </div>
 </div>

 <label class="form-checkbox-wrapper">
 <input type="checkbox" class="form-checkbox" id="terms" required data-od-id="terms-checkbox">
 <span class="form-checkbox-label">
 Li e aceito os <a href="/termos" target="_blank" rel="noopener" data-od-id="terms-link">Termos de Uso</a> e a <a href="/privacidade" target="_blank" rel="noopener" data-od-id="privacy-link">Política de Privacidade</a>
 </span>
 </label>

 <button type="submit" class="btn-primary" data-od-id="signup-button">Criar Minha Conta</button>
 </form>

 <div class="auth-footer">
 <p class="auth-footer-text">
 Já tem uma conta? <a href="/login" class="auth-footer-link" data-od-id="login-link">Faça login</a>
 </p>
 </div>
 </div>
 </div>

 <!-- Container para alertas de erro/sucesso -->
 <div id="error-container"></div>

 <!-- Integração com Backend REST -->
 <link rel="stylesheet" href="/css/alerts.css">
 <script src="/js/api-client.js"></script>

 <script>
 (function () {
 const SENHA_MINIMA = 8;
 const form = document.querySelector('[data-od-id="signup-form"]');
 const senha = document.getElementById('password');
 const confirma = document.getElementById('confirm-password');
 const contador = document.getElementById('password-counter');
 const dicaSenha = document.getElementById('password-hint');
 const dicaConfirma = document.getElementById('confirm-hint');
 const botao = form.querySelector('[data-od-id="signup-button"]');

 function feedback(mensagem) {
     window.API.exibirErro({ message: mensagem }, 'form-feedback');
 }

 // Requisito 2: contador e validação em tempo real de senha e confirmação.
 function atualizarConfirma() {
     const n = confirma.value.length;
     const igual = n > 0 && confirma.value === senha.value;
     if (n === 0) dicaConfirma.textContent = 'Repita a senha para confirmar.';
     else if (igual) dicaConfirma.textContent = 'As senhas coincidem.';
     else dicaConfirma.textContent = 'As senhas ainda não coincidem.';
     dicaConfirma.classList.toggle('ok', igual);
     dicaConfirma.classList.toggle('bad', n > 0 && !igual);
 }

 function atualizarSenha() {
     const n = senha.value.length;
     contador.textContent = n + '/' + SENHA_MINIMA;
     dicaSenha.classList.toggle('ok', n >= SENHA_MINIMA);
     dicaSenha.classList.toggle('bad', n > 0 && n < SENHA_MINIMA);
     atualizarConfirma();
 }

 senha.addEventListener('input', atualizarSenha);
 confirma.addEventListener('input', atualizarConfirma);
 atualizarSenha();

 // Requisito 1: feedback claro quando o cadastro falha (sem alert() nativo).
 form.addEventListener('submit', async function (e) {
 e.preventDefault();
 const nome = document.getElementById('fullname').value.trim();
 const email = document.getElementById('email').value.trim();
 const senhaTexto = senha.value;
 const confirmacao = confirma.value;
 const termos = document.getElementById('terms').checked;

 if (!nome || !email || !senhaTexto || !confirmacao) {
     feedback('Preencha todos os campos.');
     return;
 }
 if (senhaTexto.length < SENHA_MINIMA) {
     feedback('A senha deve ter ao menos ' + SENHA_MINIMA + ' caracteres.');
     senha.focus();
     return;
 }
 if (senhaTexto !== confirmacao) {
     feedback('As senhas não coincidem.');
     confirma.focus();
     return;
 }
 if (!termos) {
     feedback('Você precisa aceitar os Termos de Uso e a Política de Privacidade.');
     return;
 }

 const textoOriginal = botao.textContent;
 botao.disabled = true;
 botao.textContent = 'Criando conta...';
 try {
     await window.API.Auth.cadastro(nome, email, senhaTexto, 'PARTICIPANTE');
     window.location.href = '/';
 } catch (error) {
     window.API.exibirErro(error, 'form-feedback');
     botao.disabled = false;
     botao.textContent = textoOriginal;
 }
 });
 })();
 </script>
</body>
</html>
