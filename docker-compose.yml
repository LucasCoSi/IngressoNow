services:
  postgres:
    image: postgres:16-alpine
    container_name: poo2-postgres
    environment:
      POSTGRES_DB: poo2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poo2"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: poo2-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/poo2
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: my-secret-key-for-jwt-token-generation-minimum-256-bits-for-security
      PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
